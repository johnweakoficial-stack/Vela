<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vela de Aniversário Ultrarrealista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    /* Feed da câmera ao fundo */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Espelhar câmera frontal */
      opacity: 0;
      filter: brightness(0.35) contrast(1.15) blur(2px);
      transition: opacity 0.8s ease, filter 0.6s ease;
      z-index: 1;
    }

    /* Vinheta e iluminação ambiente da chama */
    #ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, rgba(255, 150, 40, 0.22) 0%, rgba(15, 8, 2, 0.85) 65%, #020204 100%);
      pointer-events: none;
      transition: background 0.6s ease;
      z-index: 2;
    }

    /* Canvas principal da vela e partículas */
    #candle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      cursor: pointer;
    }

    /* Interface de Controles */
    .ui-overlay {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    button.active {
      background: rgba(255, 145, 0, 0.28);
      border-color: rgba(255, 175, 50, 0.7);
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.35);
    }

    .status-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Barra de intensidade do sopro */
    .meter-wrapper {
      width: 180px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .meter-wrapper.visible {
      opacity: 1;
    }

    #blow-meter {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9800, #ff3d00);
      transition: width 0.06s linear;
    }

    .footer-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Câmera de fundo -->
  <video id="camera-feed" autoplay playsinline muted></video>
  <div id="ambient-glow"></div>

  <!-- Interface do Usuário -->
  <div class="ui-overlay">
    <div class="controls-row">
      <button id="sensor-btn">🎙️📷 Ativar Sopro e Câmera</button>
      <button id="relight-btn" style="display: none;">🔥 Acender Vela</button>
    </div>
    <div class="meter-wrapper" id="meter-container">
      <div id="blow-meter"></div>
    </div>
    <div class="status-text" id="status-msg">
      Toque na chama para apagar ou ative os sensores para soprar
    </div>
  </div>

  <div class="footer-hint">Dica: Faça um pedido antes de apagar ✨</div>

  <!-- Canvas para renderização da vela, fogo e fumaça -->
  <canvas id="candle-canvas"></canvas>

  <script>
    const canvas = document.getElementById('candle-canvas');
    const ctx = canvas.getContext('2d');
    const sensorBtn = document.getElementById('sensor-btn');
    const relightBtn = document.getElementById('relight-btn');
    const statusMsg = document.getElementById('status-msg');
    const cameraFeed = document.getElementById('camera-feed');
    const ambientGlow = document.getElementById('ambient-glow');
    const meterContainer = document.getElementById('meter-container');
    const blowMeter = document.getElementById('blow-meter');

    let width, height;
    let isLit = true;
    let emberGlow = 0; // Brilho da brasa recém-apagada
    let windForce = 0; // Força do sopro no momento
    let blowAccumulator = 0; // Acúmulo de sopro contínuo para apagar
    let time = 0;
    let smokeParticles = [];
    let sparkles = [];

    // Posição da vela e do pavio
    let candleX = 0;
    let candleTopY = 0;
    let wickTipX = 0;
    let wickTipY = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      candleX = width / 2;
      candleTopY = height * 0.56;
      wickTipX = candleX;
      wickTipY = candleTopY - 28;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // SENSORES: CÂMERA + DETECÇÃO DE SOPRO
    // ==========================================
    let audioContext, analyser, dataArray;
    let sensorsActive = false;

    sensorBtn.addEventListener('click', async () => {
      if (sensorsActive) return;

      try {
        statusMsg.textContent = "Solicitando acesso à câmera e microfone...";
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: { facingMode: "user" }
        });

        // Exibir câmera
        cameraFeed.srcObject = stream;
        cameraFeed.style.opacity = isLit ? '0.55' : '0.18';

        // Configurar analisador de frequências para detectar sopro
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.4;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        sensorsActive = true;

        sensorBtn.classList.add('active');
        sensorBtn.textContent = "🟢 Câmera e Sopro Ativos";
        meterContainer.classList.add('visible');
        statusMsg.textContent = "Sopre em direção ao aparelho ou toque na chama!";
      } catch (err) {
        console.error(err);
        statusMsg.textContent = "Permissão negada ou dispositivo sem câmera/microfone. Use o toque!";
      }
    });

    function analyzeBlow() {
      if (!sensorsActive || !analyser) return;

      analyser.getByteFrequencyData(dataArray);

      // O sopro gera ruído intenso nas baixas frequências (bins 0 a 18)
      let lowFreqSum = 0;
      const bins = 18;
      for (let i = 0; i < bins; i++) {
        lowFreqSum += dataArray[i];
      }
      const averageLow = lowFreqSum / bins;

      // Normalizar intensidade (limiar de ruído ambiente ~ 45)
      const normalized = Math.max(0, (averageLow - 45) / 145);
      blowMeter.style.width = `${Math.min(100, normalized * 100)}%`;

      if (isLit) {
        // Aplicar turbulência do vento na chama
        windForce = windForce * 0.8 + normalized * 0.2;

        if (normalized > 0.48) {
          blowAccumulator += normalized * 2.2;
          // Soltar fagulhas durante sopro forte
          if (Math.random() < 0.35) createSparkle();
        } else {
          blowAccumulator = Math.max(0, blowAccumulator - 0.5);
        }

        // Se soprar com força suficiente por uma fração de segundo, apaga
        if (blowAccumulator > 14 || normalized > 0.88) {
          extinguishCandle("Sopro detectado! 🎉 Faça seu pedido!");
        }
      }
    }

    // ==========================================
    // INTERAÇÃO DE TOQUE E CLIQUE
    // ==========================================
    function handlePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // Distância até a chama
      const dx = clientX - wickTipX;
      const dy = clientY - (wickTipY - 40);
      const dist = Math.hypot(dx, dy);

      if (dist < 85) {
        if (isLit) {
          extinguishCandle("Vela apagada com o toque! ✨");
        } else {
          lightCandle();
        }
      }
    }

    canvas.addEventListener('mousedown', handlePointer);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });

    relightBtn.addEventListener('click', lightCandle);

    function extinguishCandle(message) {
      if (!isLit) return;
      isLit = false;
      emberGlow = 1.0;
      blowAccumulator = 0;
      relightBtn.style.display = 'flex';
      statusMsg.textContent = message;

      // Escurecer ambiente e câmera
      ambientGlow.style.background = 'radial-gradient(circle at 50% 42%, rgba(20, 20, 30, 0.1) 0%, rgba(5, 5, 8, 0.95) 60%, #010103 100%)';
      if (sensorsActive) cameraFeed.style.opacity = '0.18';

      // Rajada inicial de fumaça
      for (let i = 0; i < 28; i++) {
        createSmokeParticle(true);
      }
    }

    function lightCandle() {
      isLit = true;
      windForce = 0;
      blowAccumulator = 0;
      relightBtn.style.display = 'none';
      statusMsg.textContent = sensorsActive
        ? "Sopre em direção ao aparelho ou toque na chama!"
        : "Toque na chama para apagar ou ative os sensores para soprar";

      ambientGlow.style.background = 'radial-gradient(circle at 50% 42%, rgba(255, 150, 40, 0.22) 0%, rgba(15, 8, 2, 0.85) 65%, #020204 100%)';
      if (sensorsActive) cameraFeed.style.opacity = '0.55';
    }

    // ==========================================
    // SISTEMA DE PARTÍCULAS (FUMAÇA E FAGULHAS)
    // ==========================================
    function createSmokeParticle(burst = false) {
      smokeParticles.push({
        x: wickTipX + (Math.random() - 0.5) * 6,
        y: wickTipY - 4,
        vx: (Math.random() - 0.5) * (burst ? 2.5 : 0.6) + windForce * 4,
        vy: -(Math.random() * 1.8 + 1.2),
        radius: Math.random() * 6 + 4,
        alpha: burst ? 0.55 : 0.38,
        life: 0,
        maxLife: Math.random() * 90 + 70
      });
    }

    function createSparkle() {
      sparkles.push({
        x: wickTipX + (Math.random() - 0.5) * 10,
        y: wickTipY - Math.random() * 40,
        vx: (Math.random() - 0.2) * 5 + windForce * 8,
        vy: -(Math.random() * 4 + 2),
        size: Math.random() * 2.5 + 1,
        alpha: 1
      });
    }

    // ==========================================
    // RENDERIZAÇÃO ULTRARREALISTA NO CANVAS
    // ==========================================
    function drawCandleBody() {
      const candleWidth = 86;
      const candleHeight = height - candleTopY + 50;
      const leftX = candleX - candleWidth / 2;

      ctx.save();

      // Sombra projetada no corpo da vela
      const bodyGrad = ctx.createLinearGradient(leftX, candleTopY, leftX + candleWidth, candleTopY);
      bodyGrad.addColorStop(0, '#c8baa8');
      bodyGrad.addColorStop(0.25, '#f5ece0');
      bodyGrad.addColorStop(0.55, '#fffdf9');
      bodyGrad.addColorStop(0.88, '#d8cab8');
      bodyGrad.addColorStop(1, '#9e8f7c');

      // Corpo cilíndrico
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(leftX, candleTopY, candleWidth, candleHeight, [10, 10, 0, 0]);
      ctx.fill();

      // Listras festivas sutis de aniversário (espiral pastel)
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(235, 95, 120, 0.75)';
      ctx.lineWidth = 14;
      for (let y = candleTopY - 20; y < height; y += 52) {
        ctx.beginPath();
        ctx.moveTo(leftX - 10, y);
        ctx.bezierCurveTo(
          candleX - 20, y + 18,
          candleX + 20, y + 18,
          leftX + candleWidth + 10, y + 32
        );
        ctx.stroke();
      }

      // Subsurface Scattering (Luz quente atravessando o topo da cera quando acesa)
      if (isLit) {
        const sssGrad = ctx.createRadialGradient(
          candleX, candleTopY + 8, 5,
          candleX, candleTopY + 25, 95
        );
        sssGrad.addColorStop(0, 'rgba(255, 165, 50, 0.65)');
        sssGrad.addColorStop(0.5, 'rgba(255, 100, 10, 0.22)');
        sssGrad.addColorStop(1, 'rgba(255, 100, 10, 0)');
        ctx.fillStyle = sssGrad;
        ctx.fillRect(leftX, candleTopY, candleWidth, 140);
      }
      ctx.restore();

      // Topo elíptico da vela (poça de cera derretida)
      ctx.beginPath();
      ctx.ellipse(candleX, candleTopY, candleWidth / 2, 12, 0, 0, Math.PI * 2);
      const topGrad = ctx.createRadialGradient(candleX, candleTopY, 2, candleX, candleTopY, candleWidth / 2);
      topGrad.addColorStop(0, isLit ? '#fff6e5' : '#e6dccf');
      topGrad.addColorStop(0.7, '#eadfd2');
      topGrad.addColorStop(1, '#bfb09d');
      ctx.fillStyle = topGrad;
      ctx.fill();

      // Gotas de cera escorrendo na lateral
      const drips = [
        { xOffset: -26, len: 48, w: 7 },
        { xOffset: 18, len: 75, w: 8 },
        { xOffset: 31, len: 34, w: 5 }
      ];
      drips.forEach(d => {
        const dx = candleX + d.xOffset;
        ctx.fillStyle = 'rgba(255, 250, 242, 0.88)';
        ctx.beginPath();
        ctx.roundRect(dx - d.w / 2, candleTopY + 4, d.w, d.len, d.w);
        ctx.fill();
      });

      // Pavio trançado
      ctx.beginPath();
      ctx.moveTo(candleX, candleTopY + 2);
      ctx.quadraticCurveTo(candleX + 2, candleTopY - 14, wickTipX, wickTipY);
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1e1b18';
      ctx.stroke();

      // Brasa incandescente na ponta do pavio (ativa quando acesa ou recém-apagada)
      const activeEmber = isLit ? 0.9 : emberGlow;
      if (activeEmber > 0.02) {
        ctx.beginPath();
        ctx.arc(wickTipX, wickTipY, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 80, 0, ${activeEmber})`;
        ctx.shadowColor = '#ff3300';
        ctx.shadowBlur = 12 * activeEmber;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    function drawFlame() {
      if (!isLit) return;

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // Oscilação natural + reação ao sopro
      const flickerX = Math.sin(time * 0.12) * 2.5 + Math.cos(time * 0.27) * 1.5;
      const windBend = windForce * 68 + (Math.random() - 0.5) * windForce * 28;
      const flameStretch = 1 - Math.min(0.45, windForce * 0.6) + Math.sin(time * 0.18) * 0.04;

      const flameHeight = 108 * flameStretch;
      const flameWidth = 28 * (1 + windForce * 0.35);

      const tipX = wickTipX + flickerX + windBend;
      const tipY = wickTipY - flameHeight;

      // 1. Halo de luz externa (bloom atmosférico)
      const haloGrad = ctx.createRadialGradient(
        wickTipX + windBend * 0.3, wickTipY - flameHeight * 0.45, 5,
        wickTipX + windBend * 0.3, wickTipY - flameHeight * 0.45, 175
      );
      haloGrad.addColorStop(0, 'rgba(255, 170, 50, 0.35)');
      haloGrad.addColorStop(0.4, 'rgba(255, 110, 10, 0.12)');
      haloGrad.addColorStop(1, 'rgba(255, 80, 0, 0)');
      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(wickTipX, wickTipY - 45, 175, 0, Math.PI * 2);
      ctx.fill();

      // 2. Corpo principal da chama (Laranja -> Amarelo -> Branco)
      const flameGrad = ctx.createLinearGradient(wickTipX, wickTipY + 8, tipX, tipY);
      flameGrad.addColorStop(0, 'rgba(40, 90, 255, 0.75)');     // Base azul rica em oxigênio
      flameGrad.addColorStop(0.18, 'rgba(255, 120, 20, 0.92)'); // Transição alaranjada
      flameGrad.addColorStop(0.55, 'rgba(255, 220, 90, 0.98)'); // Corpo amarelo quente
      flameGrad.addColorStop(0.88, 'rgba(255, 255, 220, 0.9)'); // Núcleo brilhante
      flameGrad.addColorStop(1, 'rgba(255, 160, 40, 0)');       // Ponta dissipando

      ctx.fillStyle = flameGrad;
      ctx.beginPath();
      ctx.moveTo(wickTipX, wickTipY + 4);
      // Curva esquerda
      ctx.bezierCurveTo(
        wickTipX - flameWidth, wickTipY - flameHeight * 0.25,
        tipX - flameWidth * 0.55, wickTipY - flameHeight * 0.75,
        tipX, tipY
      );
      // Curva direita
      ctx.bezierCurveTo(
        tipX + flameWidth * 0.55, wickTipY - flameHeight * 0.75,
        wickTipX + flameWidth, wickTipY - flameHeight * 0.25,
        wickTipX, wickTipY + 4
      );
      ctx.fill();

      // 3. Núcleo interno incandescente (Branco puro)
      const coreHeight = flameHeight * 0.62;
      const coreWidth = flameWidth * 0.48;
      const coreTipX = wickTipX + (flickerX + windBend) * 0.55;
      const coreTipY = wickTipY - coreHeight;

      const coreGrad = ctx.createLinearGradient(wickTipX, wickTipY, coreTipX, coreTipY);
      coreGrad.addColorStop(0, 'rgba(80, 140, 255, 0.4)');
      coreGrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.98)');
      coreGrad.addColorStop(1, 'rgba(255, 235, 160, 0.1)');

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.moveTo(wickTipX, wickTipY + 2);
      ctx.bezierCurveTo(
        wickTipX - coreWidth, wickTipY - coreHeight * 0.3,
        coreTipX - coreWidth * 0.4, wickTipY - coreHeight * 0.8,
        coreTipX, coreTipY
      );
      ctx.bezierCurveTo(
        coreTipX + coreWidth * 0.4, wickTipY - coreHeight * 0.8,
        wickTipX + coreWidth, wickTipY - coreHeight * 0.3,
        wickTipX, wickTipY + 2
      );
      ctx.fill();

      ctx.restore();
    }

    function updateAndDrawParticles() {
      // Gerar fio contínuo de fumaça enquanto a brasa ainda está quente
      if (!isLit && emberGlow > 0.08 && Math.random() < 0.45) {
        createSmokeParticle(false);
      }

      // Atualizar e desenhar fumaça
      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.life++;
        p.x += p.vx + Math.sin(time * 0.05 + p.life * 0.08) * 0.45;
        p.y += p.vy;
        p.radius += 0.22;

        const progress = p.life / p.maxLife;
        const currentAlpha = p.alpha * (1 - progress);

        if (p.life >= p.maxLife || currentAlpha <= 0.005) {
          smokeParticles.splice(i, 1);
          continue;
        }

        const smokeGrad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.radius);
        smokeGrad.addColorStop(0, `rgba(195, 200, 210, ${currentAlpha})`);
        smokeGrad.addColorStop(1, 'rgba(195, 200, 210, 0)');

        ctx.fillStyle = smokeGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Atualizar e desenhar fagulhas
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.04;

        if (s.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = `rgba(255, 210, 100, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Loop Principal de Animação
    function animate() {
      time++;
      ctx.clearRect(0, 0, width, height);

      analyzeBlow();

      // Decaimento gradual da brasa após apagar
      if (!isLit && emberGlow > 0) {
        emberGlow = Math.max(0, emberGlow - 0.0035);
      }

      // Redução suave do vento se os sensores estiverem desligados
      if (!sensorsActive) {
        windForce *= 0.92;
      }

      drawCandleBody();
      updateAndDrawParticles();
      drawFlame();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
